[package]
name = "meshyard-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
strict-only = ["iroh/strict-only"]

[dependencies]
meshyard-core.workspace = true
meshyard-store.workspace = true
blake3.workspace = true
getrandom.workspace = true
data-encoding = "=2.11.1"
iroh.workspace = true
tokio = { workspace = true, features = ["time", "io-util"] }
thiserror.workspace = true
postcard.workspace = true
serde.workspace = true
# Same mapper implementation as pinned iroh; Meshyard owns its lifecycle (ADR-012).
portmapper = "=0.19.3"
futures-util = "=0.3.34"
netwatch = "=0.19.3"

[dev-dependencies]
tempfile.workspace = true
# TLS config type is not re-exported by iroh; same exact version as Cargo.lock.
iroh-relay = { version = "=1.4.1", default-features = false }
iroh = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# Independent, socket-free QUIC TLS proof; versions already resolved in Cargo.lock.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
