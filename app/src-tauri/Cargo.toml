[package]
name = "meshyard-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "meshyard_app"
crate-type = ["rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[features]
strict-only = ["meshyard-net/strict-only"]

[dependencies]
meshyard-net.workspace = true
tauri.workspace = true
tracing.workspace = true
meshyard-core.workspace = true
meshyard-store.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time"] }
meshyard-agents.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
ts-rs.workspace = true
postcard.workspace = true
getrandom.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
sha2 = "=0.11.1"
tempfile.workspace = true
libc.workspace = true

# ADR-015: Darwin UID lookup must not require a live peer PID.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket", "user"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
meshyard-store = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true
iroh.workspace = true
data-encoding = "=2.11.1"
