[package]
name = "meshyard-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "meshyard_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tracing.workspace = true
meshyard-core.workspace = true
meshyard-store.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time"] }
meshyard-agents.workspace = true
rustix.workspace = true
serde.workspace = true
ts-rs.workspace = true
postcard.workspace = true
getrandom.workspace = true

# ADR-015: Darwin UID lookup must not require a live peer PID.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket", "user"] }

[dev-dependencies]
meshyard-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
rusqlite.workspace = true
