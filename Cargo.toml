[workspace]
resolver = "2"
members = [
    "crates/meshyard-core",
    "crates/meshyard-store",
    "crates/meshyard-net",
    "crates/meshyard-agents",
    "crates/meshyard-hook",
    "crates/meshyard-node",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
meshyard-core = { path = "crates/meshyard-core" }
meshyard-store = { path = "crates/meshyard-store" }
meshyard-net = { path = "crates/meshyard-net" }
meshyard-agents = { path = "crates/meshyard-agents" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "compression"] }
tauri-build = "=2.7.3"
tracing = "=0.1.44"
# Reserved pins for later tasks; these are not activated by the scaffold.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = "=1.53.3"
ts-rs = "=12.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
