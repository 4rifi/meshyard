[workspace]
resolver = "2"
members = [
    "crates/meshyard-core",
    "crates/meshyard-store",
    "crates/meshyard-net",
    "crates/meshyard-agents",
    "crates/meshyard-hook",
    "crates/meshyard-node",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
meshyard-core = { path = "crates/meshyard-core" }
meshyard-store = { path = "crates/meshyard-store" }
meshyard-net = { path = "crates/meshyard-net" }
meshyard-agents = { path = "crates/meshyard-agents" }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "compression"] }
tauri-build = "=2.7.3"
tracing = "=0.1.44"
# Shared pins; individual crates activate only the dependencies they need.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = { version = "=1.53.3", features = ["sync", "rt", "macros"] }
ts-rs = "=12.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"

postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
serde-big-array = "=0.5.1"
ed25519-dalek = "=3.0.0"
blake3 = "=1.8.7"
rusqlite_migration = "=2.6.0"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
security-framework = "=3.7.0"
libc = "=0.2.191"
getrandom = "=0.4.3"
zeroize = "=1.9.1"
tempfile = "=3.27.0"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
